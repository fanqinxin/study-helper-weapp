# ============================================================
# GitHub Actions · 构建并推送后端镜像到阿里云容器镜像服务
#
#   镜像仓库：registry.cn-shenzhen.aliyuncs.com/fanqx/study-helper-server
#
# 触发规则：
#   - 推送到 main            → 校验通过后构建推送（latest + main + 短SHA）
#   - 推送 v* 形式的 tag     → 校验通过后构建推送（tag 名 + 短SHA，不动 latest）
#   - Pull Request           → 只跑校验，不构建不推送
#   - 手动触发（Actions 页 Run workflow）
#        默认只跑校验；勾选 push_image 才构建推送
#        分支用 main 时推 latest，用其他分支只推分支名标签，不动 latest
#
# 需要在仓库配置的 Secrets（Settings → Secrets and variables → Actions）：
#   REGISTRY_USER     阿里云容器镜像服务用户名（主账号或 RAM 用户）
#   REGISTRY_PASSWORD 对应密码 / 访问凭证
#
# 说明：
#   - latest 只跟随 main 移动：给历史版本补打 tag 不会回退线上镜像
#   - 构建用 buildx + GitHub Actions 缓存，重复构建显著加速
# ============================================================

name: Build & Push Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # 允许在 Actions 页手动触发（默认只校验，勾选后才构建推送）
  workflow_dispatch:
    inputs:
      push_image:
        description: '构建并推送镜像（不勾选则只跑校验）'
        type: boolean
        default: false
      image_tag:
        description: '自定义镜像标签（留空则按分支名推导）'
        type: string
        required: false
        default: ''

# 同一分支的并发构建取消旧的，避免重复消耗
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.cn-shenzhen.aliyuncs.com
  IMAGE_NAMESPACE: fanqx
  IMAGE_NAME: study-helper-server

jobs:
  # ----------------------------------------------------------
  # 校验：把明显错误拦在构建之前
  # docker build 动辄几分钟，node --check 能查出的语法错误没必要等到构建
  # ----------------------------------------------------------
  verify:
    name: 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 校验后端 JS 语法
        run: |
          fail=0
          count=0
          for f in $(find server/src -name '*.js'); do
            count=$((count + 1))
            node --check "$f" || { echo "语法错误: $f"; fail=1; }
          done
          echo "已校验 $count 个文件"
          [ "$fail" -eq 0 ] || exit 1
          echo "语法校验通过"

      # node --check 只校验语法，不解析 require。
      # 相对路径写错、依赖没写进 package.json 这类问题会一路绿灯到容器启动才崩，
      # 所以这里单独做一次模块引用检查。
      - name: 校验模块引用可解析
        run: |
          cd server
          node scripts/check-requires.js

      - name: 校验 docker-compose.yml 结构
        run: |
          node -e "
          const fs = require('fs');
          const src = fs.readFileSync('docker-compose.yml', 'utf8');
          const need = ['services:', 'mysql:', 'redis:', 'api:', 'worker:', 'volumes:', 'networks:'];
          const miss = need.filter((k) => !src.split('\n').some((l) => l.trim() === k));
          if (miss.length) { console.error('缺少配置项:', miss.join(', ')); process.exit(1); }
          console.log('compose 结构检查通过');
          "

      - name: 校验脚本行尾为 LF
        run: |
          # CRLF 会让容器内 /bin/sh 报 "not found"，这里强制拦下
          bad=0
          for f in server/Dockerfile server/docker-entrypoint.sh; do
            if grep -qU $'\r' "$f"; then
              echo "::error file=$f::检测到 CRLF 行尾，容器内会执行失败"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "行尾检查通过"

      - name: 校验小程序 JSON 与页面完整性
        run: |
          node -e "
          const fs = require('fs'), path = require('path');
          let bad = 0, jsonCount = 0;
          const walk = (d) => {
            for (const f of fs.readdirSync(d)) {
              const p = path.join(d, f);
              if (fs.statSync(p).isDirectory()) { walk(p); continue; }
              if (!f.endsWith('.json')) continue;
              jsonCount++;
              try { JSON.parse(fs.readFileSync(p, 'utf8')); }
              catch (e) { console.error('JSON 解析失败:', p, e.message); bad = 1; }
            }
          };
          walk('miniprogram');
          const app = JSON.parse(fs.readFileSync('miniprogram/app.json', 'utf8'));
          let missing = 0;
          for (const pg of app.pages) {
            for (const ext of ['js', 'json', 'wxml', 'wxss']) {
              if (!fs.existsSync('miniprogram/' + pg + '.' + ext)) {
                console.error('页面文件缺失:', pg + '.' + ext); missing = 1;
              }
            }
          }
          console.log('已校验 ' + jsonCount + ' 个 JSON，' + app.pages.length + ' 个页面');
          if (bad || missing) process.exit(1);
          console.log('小程序结构检查通过');
          "

  # ----------------------------------------------------------
  # 构建推送：仅 main 分支与 tag
  # ----------------------------------------------------------
  build:
    name: 构建并推送
    runs-on: ubuntu-latest
    needs: verify
    # push 事件直接构建；手动触发需要勾选 push_image 才构建
    if: github.event_name == 'push' || inputs.push_image
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 准备镜像标签
        id: meta
        run: |
          FULL_IMAGE="$REGISTRY/$IMAGE_NAMESPACE/$IMAGE_NAME"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          CUSTOM_TAG="${{ inputs.image_tag }}"

          # 是 tag 触发还是分支触发
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            REF_TAG="${GITHUB_REF#refs/tags/}"
            # tag 构建不推 latest：给旧版本补 tag 是常见运维动作，
            # 若也推 latest 会把线上镜像悄悄回退成旧代码
            MOVE_LATEST="false"
          else
            REF_TAG="${GITHUB_REF#refs/heads/}"
            # 手动触发时：只有 main 分支才移动 latest，其他分支不动
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$REF_TAG" != "main" ]; then
              MOVE_LATEST="false"
            else
              MOVE_LATEST="true"
            fi
          fi

          # 手动指定了标签则覆盖推导结果
          if [ -n "$CUSTOM_TAG" ]; then
            REF_TAG="$CUSTOM_TAG"
          fi

          echo "full_image=$FULL_IMAGE"   >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA"     >> "$GITHUB_OUTPUT"
          echo "ref_tag=$REF_TAG"         >> "$GITHUB_OUTPUT"
          echo "move_latest=$MOVE_LATEST" >> "$GITHUB_OUTPUT"
          echo "custom_tag=$CUSTOM_TAG"   >> "$GITHUB_OUTPUT"

          echo "镜像地址: $FULL_IMAGE"
          echo "标签: $REF_TAG / $SHORT_SHA$( [ "$MOVE_LATEST" = "true" ] && echo ' / latest' )"

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 生成镜像标签
        id: tags
        env:
          FULL_IMAGE: ${{ steps.meta.outputs.full_image }}
          REF_TAG: ${{ steps.meta.outputs.ref_tag }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          MOVE_LATEST: ${{ steps.meta.outputs.move_latest }}
        run: |
          TAGS="$FULL_IMAGE:$REF_TAG,$FULL_IMAGE:$SHORT_SHA"
          if [ "$MOVE_LATEST" = "true" ]; then
            TAGS="$TAGS,$FULL_IMAGE:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "推送标签: $TAGS"

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            BUILD_VERSION=${{ steps.meta.outputs.ref_tag }}
          # 用 GitHub Actions 缓存复用构建层，重复构建显著加速
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: 输出构建结果
        env:
          FULL_IMAGE: ${{ steps.meta.outputs.full_image }}
          REF_TAG: ${{ steps.meta.outputs.ref_tag }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          MOVE_LATEST: ${{ steps.meta.outputs.move_latest }}
        run: |
          {
            echo "## 镜像已推送"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 镜像 | \`$FULL_IMAGE\` |"
            echo "| 固定标签 | \`$REF_TAG\`、\`$SHORT_SHA\` |"
            echo "| latest | $([ "$MOVE_LATEST" = "true" ] && echo '已更新' || echo '未更新（非 main 分支 / tag 构建）') |"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo ""
            echo "部署：\`docker compose pull api worker && docker compose up -d api worker\`"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
