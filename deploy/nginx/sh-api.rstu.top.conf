# ============================================================
# sh-api.rstu.top · Nginx 站点配置
#
#   用途：把小程序后端（Docker 中 172.17.0.29:3000）以 HTTPS 暴露给微信
#   放置：/etc/nginx/conf.d/sh-api.rstu.top.conf
#   校验：nginx -t && nginx -s reload
#
# 为什么用子域名而不是主域名：
#   主域名 rstu.top 和 www.rstu.top 留给以后可能加的官网 / H5 / 活动页，
#   接口独立在 sh-api 子域上，互不影响。子域名继承主域名的 ICP 备案，
#   不需要单独备案。
#
# 前置条件：
#   1. 域名 sh-api.rstu.top 已解析到本机公网 IP（A 记录）
#   2. 主域名 rstu.top 已完成 ICP 备案 —— 未备案的域名微信不允许配为合法域名
#   3. 证书已签发（见 docs/部署-Nginx与HTTPS.md 中的 certbot 步骤）
# ============================================================

# ------------------------------------------------------------
# 日志格式：额外记录上游耗时
# rt  = 整个请求耗时，urt = 后端处理耗时。
# 两者差值大说明瓶颈在 Nginx/网络，差值小说明慢在后端或 AI。
# ------------------------------------------------------------
log_format rstu_api '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time '
                    '"$http_referer" "$http_user_agent"';

# ------------------------------------------------------------
# 上游：后端 API
#
# 后端在 docker-compose 里映射为 172.17.0.29:3000，只监听回环，
# 外部无法绕过 Nginx 直连。keepalive 让 Nginx 复用长连接，
# 避免每次请求都重新握手（小程序请求密集，收益明显）。
# ------------------------------------------------------------
upstream study_helper_api {
    server 172.17.0.29:3000;
    keepalive 32;
}

# ------------------------------------------------------------
# HTTP :80
#
# 只做两件事：证书续期校验 + 跳转 HTTPS。
# 小程序必须走 HTTPS，所以这里不做任何明文业务响应。
# ------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name sh-api.rstu.top;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------
# HTTPS :443
# ------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name sh-api.rstu.top;

    # nginx ≥ 1.25.1 想开 HTTP/2 就取消下一行注释（旧版请在 listen 后加 http2 参数）
    # http2 on;

    # ---------- 证书 ----------
    # 阿里云签发的泛域名证书（*.rstu.top），解压后的目录名自带 *，
    # nginx 不做通配展开、按字面路径打开，所以能直接用。
    # *.rstu.top 覆盖一级子域，sh-api.rstu.top 正好在覆盖范围内。
    # 嫌 * 麻烦（备份/脚本里容易误展开）可以改目录名后同步改这里，例如
    #   mv '/etc/nginx/ssl/*.rstu.top_rstu.top_EC256' /etc/nginx/ssl/rstu.top
    ssl_certificate /etc/nginx/ssl/*.rstu.top_rstu.top_EC256/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/*.rstu.top_rstu.top_EC256/private.key;

    # ---------- 协议与套件 ----------
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ------------------------------------------------------------
    # OCSP Stapling
    #
    # 关掉原因：证书 CA（路径 /etc/nginx/ssl/*.rstu.top_rstu.top_EC256/）
    # 未在 AIA 扩展中提供 OCSP responder URL，nginx 会报
    #   "ssl_stapling ignored, no OCSP responder URL in the certificate"
    # 然后静默跳过——配了等于没配，还白留一条告警。
    #
    # 如果以后换掉证书（换成 Let's Encrypt / ZeroSSL 等带 OCSP URL 的 CA），
    # 把下面四行一起打开即可；resolver 是 stapling 解析 OCSP 域名用的，
    # 其他地方（proxy_pass 走的是固定 IP 172.17.0.29）用不到。
    # ------------------------------------------------------------
    # ssl_stapling              on;
    # ssl_stapling_verify       on;
    # resolver                  223.5.5.5 119.29.29.29 valid=300s;
    # resolver_timeout          5s;

    # ---------- 安全响应头 ----------
    # 注意：location 内一旦出现 add_header，本层的 add_header 就不再继承。
    # 所以下面各 location 一律不用 add_header，改用 expires 等指令。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;

    # ---------- 请求体 ----------
    # 后端单图上限 3MB（UPLOAD_MAX_SIZE_MB），这里留余量防止误伤。
    # 小程序一次只传一张图，10m 足够。
    client_max_body_size  10m;
    client_body_timeout   60s;
    client_header_timeout 15s;

    # ---------- 代理公共参数 ----------
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    # 置空才能配合 upstream keepalive 复用连接
    proxy_set_header   Connection        "";

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    # AI 批改单次最长 60s（AI_TIMEOUT_MS），失败最多重试 2 次，留足 180s
    proxy_read_timeout    180s;

    # ---------- 压缩 ----------
    # 只压文本类；图片本身已压缩，再压纯属浪费 CPU
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types        application/json
                      application/javascript
                      text/css
                      text/plain
                      application/xml
                      image/svg+xml;

    # ---------- 上传的作业图片 ----------
    # 文件名是「时间戳_随机串」，内容永不变化，可放心长缓存。
    # 用 expires 而不是 add_header，避免覆盖上面的安全响应头。
    location ^~ /static/uploads/ {
        proxy_pass http://study_helper_api;
        expires    30d;
        # 图片不回源压缩
        gzip       off;
        access_log off;
    }

    # ---------- 健康检查 ----------
    # 后端会返回 db / redis 连通状态，用于探活。
    # 若不想对外暴露，把下面注释打开、改成自己的监控出口 IP。
    location = /api/v1/health {
        # allow 1.2.3.4;
        # deny  all;
        proxy_pass http://study_helper_api;
        access_log off;
    }

    # ---------- 业务接口 ----------
    location /api/ {
        proxy_pass http://study_helper_api;
    }

    # ---------- 兜底 ----------
    # 这是接口服务，没有网页可展示；未匹配的路径直接 404，
    # 避免被扫描器探出多余信息。
    location / {
        return 404;
    }

    # 接上文件头定义的 log_format（不引用的话那段配置等于白写）。
    # 排 502 / 504 时看 urt：有值且接近 180s → 后端或 AI 慢；
    # 为空 → 根本没连上后端。
    access_log /var/log/nginx/sh-api.rstu.top.access.log rstu_api;
    error_log  /var/log/nginx/sh-api.rstu.top.error.log warn;

}
